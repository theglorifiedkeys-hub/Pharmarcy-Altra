name: Flutter verification and APK
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true
      - run: flutter pub get
      - name: Analyze Flutter
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/altra-analyze.log
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            grep -E 'error •|warning •' /tmp/altra-analyze.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$result"
      - run: flutter test
      - run: bash tool/prepare_android.sh
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Altra-Pharmacy-Flutter-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
