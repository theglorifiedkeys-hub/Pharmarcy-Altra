name: altra_pharmacy
description: Offline pharmacy workspace for Tanzania.
publish_to: none
version: 3.0.0+3
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  csv: ^6.0.0
  local_auth: ^2.3.0
  timezone: ^0.10.0
  flutter_local_notifications: 19.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/lucide.ttf
    - family: Inter
      fonts:
        - asset: assets/inter.ttf
